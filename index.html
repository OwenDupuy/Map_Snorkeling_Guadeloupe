<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Les Spots de Snorkeling en Guadeloupe</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

  <style>
    /* Taille de la carte */
    #map {
      height: 100vh;
      width: 100%;
    }

    /* --- Légende (agrandie + fond blanc) --- */
    .legend {
      background: white;
      padding: 15px;
      border-radius: 10px;
      font-size: 1.4em;
      line-height: 1.6em;
      box-shadow: 0 0 12px rgba(0,0,0,0.3);
    }

    .legend b {
      font-size: 1.2em;
    }

    .legend i {
      width: 20px !important;
      height: 20px !important;
      border-radius: 50%;
      margin-right: 10px;
      display: inline-block;
    }

    /* --- Marqueurs personnalisés colorés --- */
    .custom-marker {
      border-radius: 50%;
      border: 2px solid #ffffff;
      box-shadow: 0 0 8px rgba(0,0,0,0.4);
    }

    .rating-5 { background: #1a9850; }
    .rating-4 { background: #66bd63; }
    .rating-3 { background: #c8ffb5; }
    .rating-2 { background: #fee08b; }
    .rating-1 { background: #d73027; }

    .slider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 5px;
    }

    .slider-btn {
      border: none;
      background: rgba(0,0,0,0.6);
      color: white;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .slider-btn:hover {
      background: rgba(0,0,0,0.8);
    }

    .slider-counter {
      text-align: center;
      font-size: 0.9em;
      margin-top: 2px;
      color: #333;
    }

    .slider-img-wrapper {
      width: 180px;        /* largeur fixe de la zone image */
      height: 130px;       /* hauteur fixe => le texte ne bouge plus */
      overflow: hidden;    /* on coupe ce qui dépasse */
      border-radius: 8px;
      display: flex;
      align-items: center; /* centre l’image verticalement */
      justify-content: center; /* centre horizontalement */
    }

    .slider-img-wrapper img {
      max-width: 100%;
      max-height: 100%;
      display: block;
    }

    #filters-box {
      position: absolute;
      left: 20px;
      top: 145px;              /* ≈ sous la barre de recherche */
      right: auto;
      bottom: auto;
      transform: none;
      background: white;
      padding: 10px 12px;
      border-radius: 12px;
      box-shadow: 0 0 12px rgba(0,0,0,0.3);
      font-size: 1.1em;
      z-index: 999;           /* au-dessus de la carte et des tuiles */
    }

    /* Bouton d’en-tête (ligne "Filtres ▾") */
    .filters-header {
      width: 100%;
      background: transparent;
      border: none;
      padding: 0;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 1em;
      font-weight: 600;
      cursor: pointer;
    }

    /* Flèche animée */
    .filters-arrow {
      display: inline-block;
      transition: transform 0.2s ease;
    }

    .filters-arrow.open {
      transform: rotate(180deg); /* flèche vers le haut */
    }

    /* Contenu (les cases à cocher) */
    #filters-content {
      margin-top: 8px;
    }

    #filters-content.hidden {
      display: none;
    }

    #filters-content label {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 4px;
      font-size: 0.95em;
    }

    #filters-content input {
      margin: 0;
    }

    #filters-box h3 {
      margin-top: 0;
      margin-bottom: 10px;
      font-size: 1.1em;
    }
    #filters-box label {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
    }

    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
    }

    .lightbox.hidden {
      display: none;
    }

    .lightbox-inner {
      position: relative;
      max-width: 90vw;
      max-height: 90vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #lightbox-img {
      max-width: 100%;
      max-height: 100%;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0,0,0,0.6);
    }

    .lightbox-close {
      position: absolute;
      top: -40px;
      right: 0;
      border: none;
      background: transparent;
      color: white;
      font-size: 26px;
      cursor: pointer;
    }

    .lightbox-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: rgba(0,0,0,0.6);
      color: white;
      font-size: 32px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .lightbox-arrow.left {
      left: -50px;
    }

    .lightbox-arrow.right {
      right: -50px;
    }

    /* Quand une popup est ouverte, on masque les UI par-dessus */
    body.popup-open #filters-box,
    body.popup-open .legend,
    body.popup-open .leaflet-control-layers,
    body.popup-open .leaflet-control-zoom,
    body.popup-open .leaflet-control-search {
      opacity: 0;
      pointer-events: none;
    }

    /* Quand la modale de langue est ouverte, on floute la carte */
    body.lang-modal-open #map {
      filter: blur(6px);
      pointer-events: none;
    }
    
    /* Overlay plein écran pour centrer le carré blanc */
    #language-modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4); /* léger voile noir pour l’arrière-plan */
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20000;
    }

    /* Cachée quand on a choisi la langue */
    #language-modal.hidden {
      display: none;
    }

    /* Le carré blanc au centre */
    .language-modal-content {
      background: white;
      padding: 24px 30px;
      border-radius: 16px;
      box-shadow: 0 0 20px rgba(0,0,0,0.3);
      max-width: 90vw;
      text-align: center;
      font-family: system-ui, sans-serif;
    }

    .language-modal-content h2 {
      margin-top: 0;
      margin-bottom: 12px;
    }

    .language-buttons {
      display: flex;
      gap: 16px;
      justify-content: center;
      margin-top: 10px;
    }

    .language-buttons button {
      border: none;
      border-radius: 999px;
      padding: 10px 18px;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }

    .language-buttons button:hover {
      transform: translateY(-1px);
    }

    .language-buttons .btn-fr {
      background: #1a9850;
      color: white;
    }

    .language-buttons .btn-en {
      background: #0077b6;
      color: white;
    }

    .lang-button {
      width: 100%;
      padding: 8px 10px;
      background: #f0f0f0;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 8px;
      font-size: 1em;
    }

    .lang-button:hover {
      background: #e0e0e0;
    }

    /* Titre overlay dans la lightbox */
    .lightbox-title {
      position: absolute;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      color: #fff;
      font-family: 'Dancing Script', cursive;
      font-size: 2rem;
      font-weight: 600;
      text-shadow: 0 0 12px rgba(0,0,0,0.75);
      pointer-events: none;
    }

    /* --- Instagram button bottom-right --- */
    #insta-button {
      position: absolute;
      right: 20px;
      bottom: 20px;
      z-index: 9999;
    }

    #insta-button img {
      width: 100px;           /* adjust size as you like */
      height: 100px;
      border-radius: 25px;    /* makes it round if the image is square */
      box-shadow: 0 0 10px rgba(0,0,0,0.4);
      cursor: pointer;
      object-fit: cover;
    }

    .popup-comments {
      margin-top: 10px;
      max-height: 260px;
      overflow-y: auto;
      border-top: 1px solid rgba(0,0,0,0.1);
      padding-top: 6px;
    }

    .popup-comments .comments-hint {
      font-size: 0.85em;
      margin-bottom: 4px;
      color: #555;
    }

    .popup-comments {
      margin-top: 10px;
    }

    /* La petite barre cliquable "Ajouter un commentaire" */
    .comments-toggle {
      width: 100%;
      border: none;
      background: #f0f0f0;
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 0.9em;
      text-align: left;
      cursor: pointer;
    }

    .comments-toggle:hover {
      background: #e0e0e0;
    }

    /* Le bloc qui contient réellement Disqus */
    .comments-panel {
      margin-top: 6px;
      max-height: 260px;
      overflow-y: auto;
      border-top: 1px solid rgba(0,0,0,0.1);
      padding-top: 6px;
    }

    .comments-panel.hidden {
      display: none;
    }

    .popup-comments .comments-hint {
      font-size: 0.85em;
      margin-bottom: 4px;
      color: #555;
    }

    .leaflet-popup {
      width: 700px !important;     /* largeur totale de la popup */
    }
    
    .leaflet-popup-content {
      width: 650px !important;     /* largeur interne */
      text-align: justify;
      font-size: 1.5em;
    }

    /* === Animations et petits effets esthétiques === */

    /* Animation ouverture de la lightbox (zoom + fade) */
    .lightbox-inner {
      opacity: 0;
      transform: scale(0.94);
      transition: opacity 0.25s ease, transform 0.25s ease;
    }
    
    .lightbox:not(.hidden) .lightbox-inner {
      opacity: 1;
      transform: scale(1);
    }
    
    /* Hover smooth sur le bouton Instagram */
    #insta-button img {
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    
    #insta-button img:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 12px 25px rgba(0,0,0,0.35);
    }
    
    /* Micro animation sur le bouton "Menu" */
    .filters-header {
      transition: background 0.2s ease, transform 0.1s ease;
    }
    
    .filters-header:hover {
      background: rgba(0,0,0,0.03);
      transform: translateY(-1px);
    }
    /* Style bloc ACCÈS dans les popups */
    /* Style bloc ACCÈS dans les popups */
    .popup-access {
      background: #f6faf7;
      padding: 6px 8px;
      border-radius: 8px;
      margin-top: 6px;
    }

    @media (max-width: 768px) {
      /* Limite la hauteur totale de la popup */
      .leaflet-popup-content {
        max-height: 65vh;         /* <= la popup n'occupe jamais plus de 65% de la hauteur écran */
        overflow-y: auto;         /* Ajoute un scroll interne si besoin */
        font-size: 1.2em;         /* Légère réduction du texte */
        padding: 4px 6px !important;  /* Marges internes un peu plus larges mais compactes */
        width: auto !important;        /* laisse Leaflet adapter la largeur */
        max-width: 80vw !important;    /* ne dépasse jamais 80% de la largeur écran */
        overflow-wrap: break-word;
      }
    
      /* Wrapper interne de la popup */
      .leaflet-popup-content-wrapper {
        padding: 10px 12px !important; /* un peu plus de marge mais compact */
        border-radius: 12px !important;
        max-width: 85vw !important;
      }
    
      /* Bulle globale : on ne change PAS la largeur */
      .leaflet-popup {
        max-width: 350px !important; /* même largeur qu'avant */
      }

      .comments-panel {
        max-height: 200px;
      }

      .popup-comments {
        max-height: 200px;
      }

      #insta-button img {
        width: 60px;
        height: 60px;
        aspect-ratio: 1 / 1;
        border-radius: 20px;
        object-fit: cover;
      }
      
      /* 2. Réduire les marges et resserrer les contrôles en haut à gauche */
      .leaflet-top.leaflet-left .leaflet-control {
        margin-top: 6px;      /* espace vertical minimal entre les contrôles */
        margin-left: 6px;
      }
      
      /* Lightbox plus adaptée au téléphone */
      .lightbox-inner {
        max-width: 90vw;
        max-height: 70vh;
        padding: 0 10px;
      }

      #lightbox-img {
        max-width: 100%;
        max-height: 80vh;
      }

      .lightbox-arrow.left {
        left: 10px;
      }

      .lightbox-arrow.right {
        right: 10px;
      }

      .lightbox-close {
        top: 10px;
        right: 10px;
      }

      /* Slider images plus grand sur mobile */
      .slider-img-wrapper {
        width: 70vw;
        height: 40vw;
      }

      .slider-btn {
        width: 32px;
        height: 32px;
        font-size: 18px;
      }

      /* Filtres en bas au centre */
      #filters-box {
        left: 50%;
        right: auto;
        top: auto;
        bottom: 20px;
        transform: translateX(-50%);
        font-size: 1em;
        padding: 8px 10px;
      }

      /* Légende réduite */
      .legend {
        font-size: 1em !important;     /* ↓ taille texte */
        padding: 10px !important;      /* ↓ marges internes */
      }

      .legend i {
        width: 14px !important;        /* ↓ taille des cercles */
        height: 14px !important;
        margin-right: 6px !important;
      }

      /* Réduction du menu des fonds de carte */
      .leaflet-control-layers {
        font-size: 0.8em !important;     /* taille du texte */
        padding: 4px !important;         /* marge interne */
      }

      .leaflet-control-layers label {
        font-size: 0.9em !important;
      }

      .leaflet-control-layers-expanded {
        padding: 6px !important;
      }

      .lightbox-title {
        font-size: 1.3rem;      /* plus petit sur mobile */
        bottom: 12px;           /* optionnel : remonter un peu le texte */
      }
    }

    /* Contrôle des fonds de carte intégré dans le menu */
    #menu-baselayers .leaflet-control,
    #menu-baselayers .leaflet-control-layers {
      float: none;        /* pas de flottant */
      clear: both;
      display: block;
      margin: 0;          /* pas de marge autour de la boîte Leaflet */
    }

    /* On enlève la boîte indépendante et l’ombre portée */
    #menu-baselayers .leaflet-control-layers {
      background: transparent;
      box-shadow: none;
      border-radius: 0;
      padding: 0;
    }

    /* Optionnel : un peu d’air autour du contenu du contrôle */
    #menu-baselayers .leaflet-control-layers-list {
      margin-top: 4px;
    }
    
  </style>

</head>
  
<body>

  <div id="filters-box">
    <button id="filters-toggle" class="filters-header">
      <span>Menu</span>
      <span class="filters-arrow">▾</span>
    </button>

    <div id="filters-content" class="hidden">
      <!-- 1. Fonds de carte -->
      <div id="menu-baselayers"></div>
      <hr style="margin:8px 0;">

      <!-- 3. Filtres par note -->
      <label><input type="checkbox" data-rating="5" checked> 5 ★ Excellent</label>
      <label><input type="checkbox" data-rating="4" checked> 4 ★ Très bien</label>
      <label><input type="checkbox" data-rating="3" checked> 3 ★ Bien</label>
      <label><input type="checkbox" data-rating="2" checked> 2 ★ Neutre</label>
      <label><input type="checkbox" data-rating="1" checked> 1 ★ Mauvais</label>

      <hr style="margin:8px 0;">

      <!-- 3b. Filtres espèces -->
      <label><input type="checkbox" data-species="tortue"> Tortues 🐢</label>
      <label><input type="checkbox" data-species="requin"> Requins 🦈</label>

      <hr>

      <!-- 4. Changer de langue -->
      <button onclick="openLanguageModal()" class="lang-button">🌐 Changer de langue</button>
</div>


  </div>
  <div id="map"></div>

  <div id="lightbox" class="lightbox hidden">
    <div class="lightbox-inner">
      <button class="lightbox-close" onclick="closeLightbox()">✕</button>

      <button class="lightbox-arrow left" onclick="changeLightboxImage(-1)">‹</button>

      <img id="lightbox-img" src="" alt="Photo spot">

      <!-- 🔥 Titre overlay -->
      <div class="lightbox-title">Underwater Insights</div>

      <button class="lightbox-arrow right" onclick="changeLightboxImage(1)">›</button>
    </div>
  </div>

  <!-- MODALE DE LANGUE -->
  <div id="language-modal">
    <div class="language-modal-content">
      <h2>Choose your language</h2>
      <p>You can change the language later in the "Menu".</p>
      <div class="language-buttons">
        <button class="btn-fr" onclick="selectLanguage('fr')">Français</button>
        <button class="btn-en" onclick="selectLanguage('en')">English</button>
      </div>
    </div>
  </div>

  <!-- 🔗 Instagram button -->
  <div id="insta-button">
    <a href="https://www.instagram.com/underwater_insights/"
       target="_blank"
       rel="noopener noreferrer">
      <img src="images/insta.png" alt="Instagram Underwater Insights">
    </a>
  </div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet-search@4.0.0/dist/leaflet-search.min.js"></script>

  <script>

    // === Choix de langue & textes FR/EN ===
    let currentLang = 'en';

    const i18n = {
      fr: {
        legendTitle: "Qualité du spot",
        filtersTitle: "Menu",
        ratingTexts: {
          5: "5 ★ Excellent",
          4: "4 ★ Très bien",
          3: "3 ★ Bien",
          2: "2 ★ Neutre",
          1: "1 ★ Mauvais"
        },
        species: {
          tortue: "Tortues 🐢",
          requin: "Requins 🦈"
        },
        searchPlaceholder: "Rechercher un spot...",
        mapLayers: {
          satellite: "Vue Satellite",
          osm: "Carte classique (OSM)",
          relief: "Relief / Topographie"
        },
        changeLanguage: "Changer de langue",
        commentsTitle: "💬 Commentaires sur ce spot :",
        commentsToggleClosed: "💬 Ajouter un commentaire",
        commentsToggleOpen: "✕ Masquer les commentaires",
        itineraryLink: "📍 Itinéraire Google Maps",
        accessTitle: "Accès"
      },
      en: {
        legendTitle: "Spot quality",
        filtersTitle: "Menu",
        ratingTexts: {
          5: "5 ★ Excellent",
          4: "4 ★ Very good",
          3: "3 ★ Good",
          2: "2 ★ Average",
          1: "1 ★ Poor"
        },
        species: {
          tortue: "Turtles 🐢",
          requin: "Sharks 🦈"
        },
        searchPlaceholder: "Search a spot...",
        mapLayers: {
          satellite: "Satellite View",
          osm: "Classic map (OSM)",
          relief: "Relief / Topographic"
        },
        changeLanguage: "Change language",
        commentsTitle: "💬 Comments on this spot:",
        commentsToggleClosed: "💬 Add a comment",
        commentsToggleOpen: "✕ Hide comments",
        itineraryLink: "📍 Directions on Google Maps",
        accessTitle: "Access"
      }
    };

    // Ces variables serviront à manipuler la légende et la barre de recherche
    let legendControl;
    let searchControl;

    // À l'ouverture de la page, on affiche la modale et on floute la carte
    document.body.classList.add('lang-modal-open');

    // Si tu veux mémoriser le choix dans le navigateur :
    const savedLang = localStorage.getItem('snorkelLang');
    if (savedLang) {
      currentLang = savedLang;
      // On cache la modale et on enlève le flou tout de suite
      document.getElementById('language-modal').classList.add('hidden');
      document.body.classList.remove('lang-modal-open');
    }

    // Fonction appelée quand on clique sur Français / English
    function selectLanguage(lang) {
      currentLang = lang;
      localStorage.setItem('snorkelLang', lang);

      document.getElementById('language-modal').classList.add('hidden');
      document.body.classList.remove('lang-modal-open');

      // On applique la langue à toute l’interface
      applyLanguage();
    }

    // Fonction pour rouvrir la modale de langue
    function openLanguageModal() {
      const modal = document.getElementById('language-modal');
      modal.classList.remove('hidden');
      document.body.classList.add('lang-modal-open');
    }

    /* ----------------------------------------------------------
       1. Définir les limites autour de la Guadeloupe
    ----------------------------------------------------------- */
    const guadeloupeBounds = L.latLngBounds(
      [15.7, -62.1],   // sud-ouest
      [16.6, -60.9]    // nord-est
    );

    /* ----------------------------------------------------------
       2. Création de la carte + blocages de déplacement
    ----------------------------------------------------------- */
    const map = L.map('map', {
      center: [16.265, -61.551],
      zoom: 10,
      maxBounds: guadeloupeBounds,
      maxBoundsViscosity: 1.0
    });

    // 👉 Nouveau : layer qui contiendra tous les markers
    const markersLayer = L.layerGroup().addTo(map);


    /* ----------------------------------------------------------
       3. Tuiles (fonds de carte)
    ----------------------------------------------------------- */
    const satellite = L.tileLayer(
      'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
      { attribution: 'Tiles © Esri — Source: Esri, USDA, USGS, GeoEye, etc.' }
    );
    
    const osm = L.tileLayer(
      'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
      { attribution: '© OpenStreetMap contributors' }
    );

    const relief = L.tileLayer(
      'https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',
      { attribution: '© OpenTopoMap (CC-BY-SA)' }
    );

    // Couche par défaut
    satellite.addTo(map);

    /* ----------------------------------------------------------
       4. Contrôle permettant de changer de fond de carte
    ----------------------------------------------------------- */
    let baseLayers = {};

    let layersControl = null;

    /* ----------------------------------------------------------
       5. Fonctions utilitaires pour couleurs + étoiles
    ----------------------------------------------------------- */
    function getColor(rating) {
      switch (rating) {
        case 5: return "#1a9850";
        case 4: return "#66bd63";
        case 3: return "#c8ffb5";
        case 2: return "#fee08b";
        case 1: return "#d73027";
        default: return "#888";
      }
    }

    function getStars(rating) {
      return "★".repeat(rating) + "☆".repeat(5 - rating);
    }

    /* ----------------------------------------------------------
       6. Spots (à adapter avec tes vrais lieux + photos)
    ----------------------------------------------------------- */
    const spots = [
      {

          en: "Petite Biche, Grand Cul-de-Sac Marin"
        },
        desc: {
          fr: "A venir",
          en: "Coming soon"
        },
        coords: [16.3434, -61.6522],
        rating: 3,
        species: [],
        images: []
      },
      {
        name: {
          fr: "Îlet Caret, Grand Cul-De-Sac Marin",
          en: "Caret Islet, Grand Cul-de-Sac Marin"
        },
        desc: {
          fr: "A venir",
          en: "Coming soon"
        },
        coords: [16.3561, -61.6274],
        rating: 3,
        species: [],
        images: []
      }
    ];

    /* ----------------------------------------------------------
       7. Marqueurs colorés + popup avec photo
    ----------------------------------------------------------- */

    // Index courant de l'image pour chaque spot
    const currentImageIndex = spots.map(() => 0);

    const sliderIntervals = {}; // pour mémoriser les setInterval par spot
    let lightboxSpotIndex = null;
    
    // Fonction appelée par les boutons ‹ et › dans la popup
    function changeImage(spotIndex, direction) {
      const imgs = spots[spotIndex].images;
      if (!imgs || imgs.length === 0) return;

      const n = imgs.length;
      currentImageIndex[spotIndex] =
        (currentImageIndex[spotIndex] + direction + n) % n;

      const imgEl = document.getElementById(`slider-img-${spotIndex}`);
      const counterEl = document.getElementById(`slider-counter-${spotIndex}`);

      if (imgEl) {
        imgEl.src = imgs[currentImageIndex[spotIndex]];
      }
      if (counterEl) {
        counterEl.textContent = `${currentImageIndex[spotIndex] + 1} / ${n}`;
      }

      // si la lightbox est ouverte sur ce spot, on met aussi à jour la grande image
      if (lightboxSpotIndex === spotIndex) {
        const bigImg = document.getElementById('lightbox-img');
        if (bigImg) {
          bigImg.src = imgs[currentImageIndex[spotIndex]];
        }
      }
    }

    function openLightbox(spotIndex) {
      const imgs = spots[spotIndex].images;
      if (!imgs || imgs.length === 0) return;

      lightboxSpotIndex = spotIndex;

      const bigImg = document.getElementById('lightbox-img');
      bigImg.src = imgs[currentImageIndex[spotIndex]];

      document.getElementById('lightbox').classList.remove('hidden');
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.add('hidden');
      lightboxSpotIndex = null;
    }

    function changeLightboxImage(direction) {
      if (lightboxSpotIndex === null) return;
      changeImage(lightboxSpotIndex, direction);  // réutilise la logique existante
    }

    // === Générer la partie images (slider) de la popup, indépendant de la langue ===
    function generateImagesHtml(spot, index) {
      if (!spot.images || spot.images.length === 0) return "";
      return `
        <div class="slider">
          <button type="button"
                  class="slider-btn"
                  onclick="changeImage(${index}, -1)">‹</button>
          <div class="slider-img-wrapper"
               onclick="openLightbox(${index})">
            <img id="slider-img-${index}"
                  src="${spot.images[0]}"
                  alt="${spot.name[currentLang] || spot.name}">
          </div>
          <button type="button"
                  class="slider-btn"
                  onclick="changeImage(${index}, 1)">›</button>
        </div>
        <div class="slider-counter"
              id="slider-counter-${index}">
              1 / ${spot.images.length}
        </div>
      `;
    }

    // Génère le HTML complet de la popup d'un spot (titre, desc, note, photos, itinéraire)
    function generatePopupContent(spot, index) {
      const t = i18n[currentLang];
      const [lat, lng] = spot.coords;
      const gmapsUrl = `https://www.google.com/maps?q=${lat},${lng}`;
    
      return `
        <b>${spot.name[currentLang]}</b><br>
        ${spot.desc[currentLang]}<br>
    
        ${spot.access ? `
        <hr style="margin:10px 0;">
        <b>${i18n[currentLang].accessTitle}</b><br>
        <div class="popup-access">
        ${spot.access[currentLang]}
        </div>
        ` : ""}
    
        Note : ${getStars(spot.rating)}<br><br>
        ${generateImagesHtml(spot, index)}
        <br>
        <a href="${gmapsUrl}" target="_blank" rel="noopener noreferrer">
          ${t.itineraryLink}
        </a>
      `;
    }
    
    // === Appliquer la langue à l’interface ===
    function applyLanguage() {
      const t = i18n[currentLang];

      // 1) Mettre à jour le texte du bouton "Filtres"
      const filtersTitleSpan = document.querySelector('#filters-toggle span');
      if (filtersTitleSpan) {
        filtersTitleSpan.textContent = t.filtersTitle;
      }

      // === 🔥 Mise à jour des popups (titres + descriptions) ===
      spots.forEach((spot, index) => {
        const marker = spot._marker;

        const newPopupContent = generatePopupContent(spot, index);
      
        marker.bindPopup(newPopupContent);
        marker.options.title = spot.name[currentLang]; // important pour la recherche
      });

      // Texte du bouton "Changer de langue" dans le menu
      const langBtn = document.querySelector('.lang-button');
        if (langBtn) {
          langBtn.textContent = `🌐 ${t.changeLanguage}`;
        }
      
      // === 🔥 Mise à jour des fonds de carte ===
      // On retire l’ancien contrôle
      if (layersControl) map.removeControl(layersControl);

      // On recrée baseLayers avec les bons noms
      baseLayers = {};
      baseLayers[t.mapLayers.satellite] = satellite;
      baseLayers[t.mapLayers.osm] = osm;
      baseLayers[t.mapLayers.relief] = relief;

      layersControl = L.control.layers(baseLayers, null, {
        collapsed: false
      }).addTo(map);

      // On replace le control dans le menu
      const layersContainer = layersControl.getContainer();
      document.getElementById('menu-baselayers').innerHTML = "";
      document.getElementById('menu-baselayers').appendChild(layersContainer);

      // 2) Mettre à jour les labels des filtres
      const filtersContent = document.getElementById('filters-content');
      if (filtersContent) {
        const ratingCheckboxes = filtersContent.querySelectorAll('input[data-rating]');
        ratingCheckboxes.forEach(cb => {
          const rating = Number(cb.dataset.rating);
          // le texte du label est dans le nœud texte après l’input
          cb.parentElement.lastChild.textContent = ' ' + t.ratingTexts[rating];
        });

        const speciesCheckboxes = filtersContent.querySelectorAll('input[data-species]');
        speciesCheckboxes.forEach(cb => {
          const sp = cb.dataset.species;
          cb.parentElement.lastChild.textContent = ' ' + t.species[sp];
        });
      }

      // 3) Recréer la légende dans la bonne langue
      if (legendControl) {
        map.removeControl(legendControl);
      }
      legendControl = L.control({ position: 'topright' });
      legendControl.onAdd = function () {
        const div = L.DomUtil.create('div', 'legend');
        const ratings = [5, 4, 3, 2, 1];

        div.innerHTML += "<b>" + t.legendTitle + "</b><br>";

        ratings.forEach(r => {
          div.innerHTML += `
            <i style="background:${getColor(r)};"></i>
            ${getStars(r)}<br>
          `;
        });

        return div;
      };
      legendControl.addTo(map);

      // 4) Mettre à jour le placeholder de recherche
      if (searchControl && searchControl._input) {
        searchControl._input.placeholder = t.searchPlaceholder;
      }
    }
    
    spots.forEach((spot, index) => {

      const popupContent = generatePopupContent(spot, index);

      const icon = L.divIcon({
        className: `custom-marker rating-${spot.rating}`,
        iconSize: [24, 24],
        iconAnchor: [12, 12]
      });
    
      const marker = L.marker(spot.coords, {
        icon,
        title: spot.name[currentLang]
      }).bindPopup(popupContent);
    
      marker.rating = spot.rating;
      spot._marker = marker;
      marker.spotIndex = index;
    
      markersLayer.addLayer(marker);
    });

    /* ----------------------------------------------------------
       8. Légende étoiles + couleurs
    ----------------------------------------------------------- */
    

    // ----------------------------------------------------------
    // 9. Contrôle de recherche des spots
    // ----------------------------------------------------------
    searchControl = new L.Control.Search({
      layer: markersLayer,
      propertyName: 'title',
      marker: false,
      initial: false,
      zoom: 14,
      textPlaceholder: 'Rechercher un spot...',
      collapsed: false,
      position: 'topleft'
    });

    searchControl.on('search:locationfound', function (e) {
      if (e.layer._popup) {
        e.layer.openPopup();
      }
    });

    // On l’ajoute à la carte…
    map.addControl(searchControl);

    applyLanguage();

  // --- Auto-défilement des images + gestion UI + recentrage fixe ---
    map.on('popupopen', function (e) {
      // 1) cacher filtres / légende / contrôles
      document.body.classList.add('popup-open');

      const marker = e.popup._source;
      const i = marker.spotIndex;

      // 2) Slider auto
      const imgs = spots[i].images;
      if (imgs && imgs.length > 1) {
        if (sliderIntervals[i]) {
          clearInterval(sliderIntervals[i]);
        }
        sliderIntervals[i] = setInterval(() => {
          changeImage(i, 1);
        }, 10000); // 10 s
      }

      // 3) Zoom fixe + décalage fixe
      const isMobile = window.innerWidth <= 768;

      // a) on force d’abord un zoom EXACT, identique pour tous
      const targetZoom = isMobile ? 13 : 13;
      map.setView(marker.getLatLng(), targetZoom, { animate: false });

      // b) on calcule la position en pixels à CE zoom
      let p = map.project(marker.getLatLng(), targetZoom);

      // c) on applique un décalage vertical constant (en pixels d’écran)
      const offset = isMobile ? 180 : 180;  // ↑ augmente la valeur pour remonter la popup
      p.y -= offset;

      // d) nouvelle latitude/longitude correspondant à cette position
      const finalLatLng = map.unproject(p, targetZoom);

      // e) et on anime pour aller à cet endroit
      map.flyTo(finalLatLng, targetZoom, {
        animate: true,
        duration: 0.6
      });
    });
    
    map.on('popupclose', function (e) {
      // 1) on ré-affiche filtres / légende / contrôles
      document.body.classList.remove('popup-open');

      // 2) on coupe le slider auto
      const marker = e.popup._source;
      const i = marker.spotIndex;

      if (sliderIntervals[i]) {
        clearInterval(sliderIntervals[i]);
        delete sliderIntervals[i];
      }
    });

    // --- Ouverture / fermeture du bloc filtres ---
    const filtersToggle = document.getElementById('filters-toggle');
    const filtersContent = document.getElementById('filters-content');
    const filtersArrow = document.querySelector('.filters-arrow');

    filtersToggle.addEventListener('click', () => {
      filtersContent.classList.toggle('hidden');
      filtersArrow.classList.toggle('open');
    });

    
    // ----------------------------------------------------------
    // 10. FILTRE PAR NOTE
    // ----------------------------------------------------------
    const checkboxes = document.querySelectorAll('#filters-box input[type="checkbox"]');

    checkboxes.forEach(cb => {
      cb.addEventListener('change', () => {

        // --- 1. Notes autorisées ---
        const allowedRatings = [...checkboxes]
          .filter(c => c.checked && c.dataset.rating)
          .map(c => Number(c.dataset.rating));

        // --- 2. Espèces cochées ---
        const allowedSpecies = [...checkboxes]
          .filter(c => c.checked && c.dataset.species)
          .map(c => c.dataset.species);

        spots.forEach(spot => {
          const m = spot._marker;

          // --- Condition rating ---
          const ratingOK = allowedRatings.includes(spot.rating);

          // --- Condition espèces ---
          let speciesOK = true;

          if (allowedSpecies.length > 0) {
            // le spot doit contenir toutes les espèces cochées
            speciesOK = allowedSpecies.every(sp => spot.species.includes(sp));
          }

          // --- Affichage ou masquage ---
          if (ratingOK && speciesOK) {
            markersLayer.addLayer(m);
          } else {
            markersLayer.removeLayer(m);
          }
        });
      });
    });

  </script>
</body>
</html>
